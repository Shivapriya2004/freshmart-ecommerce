<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Order Confirmed | FreshMart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="status-page">
    <div class="status-card">
      <div class="status-icon"><i class="bi bi-check-lg"></i></div>
      <h2 class="mb-1">Order Confirmed! ✓</h2>
      <p class="text-muted mb-4">Thank you for your order.</p>

      <div id="orderDetailsWrap" class="text-start">
        <!-- Order details are inserted here by JavaScript -->
      </div>

      <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
        <a href="index.html#products" class="btn btn-fresh w-100">Continue Shopping</a>
        <a href="index.html#home" class="btn btn-fresh-outline w-100">Back to Home</a>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const wrap = document.getElementById("orderDetailsWrap");
      const saved = localStorage.getItem("freshmart_order");

      if (!saved) {
        wrap.innerHTML = `<p class="text-center text-muted">No recent order was found.</p>`;
        return;
      }

      const order = JSON.parse(saved);

      wrap.innerHTML = `
        <div class="detail-row">
          <span class="detail-label">Customer Name:</span>
          <span class="detail-value">${order.name}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Phone Number:</span>
          <span class="detail-value">${order.phone}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Email Address:</span>
          <span class="detail-value">${order.email}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Order Details:</span>
          <span class="detail-value">${order.details}</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">Delivery Address:</span>
          <span class="detail-value">${order.address}</span>
        </div>
      `;
    });
  </script>
</body>
</html>
