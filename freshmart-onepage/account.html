<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Account | FreshMart</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <div class="status-page">
    <div class="status-card">
      <div class="status-icon"><i class="bi bi-person-check-fill"></i></div>
      <h2 class="mb-1">Welcome Back! 👋</h2>
      <p class="text-medium-green fw-semibold mb-1">Login Successful!</p>
      <p class="text-muted mb-4">You are successfully logged in.</p>

      <div class="detail-row">
        <span class="detail-label">Logged in as:</span>
        <span class="detail-value" id="accountEmail">—</span>
      </div>

      <div class="d-flex flex-column flex-sm-row gap-3 mt-4">
        <a href="index.html#products" class="btn btn-fresh w-100">Continue Shopping</a>
        <button class="btn btn-fresh-outline w-100" onclick="logoutUser()">Logout</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const email = localStorage.getItem("freshmart_login_email");
      document.getElementById("accountEmail").textContent = email || "Guest";
    });
  </script>
</body>
</html>
